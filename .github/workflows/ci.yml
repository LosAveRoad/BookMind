name: BookMind CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  frontend:
    name: Frontend Build & Test (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests (Vitest)
        run: npm test

      - name: Build production static bundle
        run: npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  backend:
    name: Backend Build, Checkstyle, Enforcer & Tests (Java 21)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Download frontend dist into Spring Boot static resources
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: book-server/src/main/resources/static

      - name: Run Maven verify (compile, unit tests, Checkstyle, Enforcer, Shade plugin JAR)
        run: mvn -B verify

      - name: Verify independent PDF plugin build command (without building book-server/book-rag)
        run: mvn -B -pl book-plugin-pdf -am package

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package standalone release and record SHA-256
        run: python .github/release/package.py ../release

      - uses: actions/upload-artifact@v4
        with:
          name: bookmind-release
          path: ../release/
          if-no-files-found: error

  release-smoke:
    name: Start extracted ZIP on ${{ matrix.os }}
    needs: backend
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: bookmind-release
          path: release
      - name: Verify checksum and launch from a fresh extraction
        run: python .github/release/smoke.py release/BookMind.zip
